spring.application.name=auth-demo

# Web server
server.port=8080

# Server side session settings
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=AUTHDEMOSESSION

# Thymeleaf (disable template caching so edits show up without a restart)
spring.thymeleaf.cache=false

# The log file location is configured in src/main/resources/logback-spring.xml
